# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit Configuration for RogueNode - POV Mode
# DevOps Adventure Game with PDDL-Driven Mission System
# Focus: Essential security, Convex backend patterns, and PDDL integration validation

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

language: "en-US"
tone_instructions: "Focus on security (auth, game state) and architecture (PDDL, backend consolidation). POV mode: prioritize clean architecture, no backwards compatibility."
early_access: true
enable_free_tier: true

# =============================================================================
# REVIEWS
# =============================================================================

reviews:
  # Chill profile for faster MVP development iterations
  profile: "chill"

  # Allow merges with warnings for faster development velocity
  request_changes_workflow: false

  # Enhanced summary and documentation
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: true

  # Auto-generation features
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: "Generate concise, descriptive titles following conventional commit format (feat/fix/docs/refactor/test/security). Focus on game mechanics, topology features, or backend changes."

  # Review feedback and status
  review_status: true
  commit_status: true
  fail_commit_status: true

  # Walkthrough enhancements
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true

  # Labeling and reviewer suggestions
  suggested_labels: true
  auto_apply_labels: true
  suggested_reviewers: true
  auto_assign_reviewers: false

  # Keep the fun element
  poem: true

  # RogueNode-specific labeling instructions
  labeling_instructions:
    - label: "security"
      instructions: "Apply when changes involve Convex auth, Clerk integration, game state integrity, or secrets handling."
    - label: "game-mechanics"
      instructions: "Apply for adventure game logic, command parsing, inventory system, room navigation, or enemy interactions."
    - label: "pddl-integration"
      instructions: "Apply for PDDL planner integration, mission validation, plan generation, or domain-spec changes."
    - label: "convex-backend"
      instructions: "Apply when changes touch Convex schema, queries, mutations, actions, auth config, or internal APIs."
    - label: "clerk-auth"
      instructions: "Apply for Clerk authentication flows, user management, session handling, or auth middleware."
    - label: "terminal-ui"
      instructions: "Apply for game terminal interface, CRT styling, command input/output, or retro terminal aesthetics."
    - label: "domain-spec"
      instructions: "Apply for changes to packages/domain-spec (data.ts, schema.ts, runtime.ts, or generated artifacts)."
    - label: "architecture"
      instructions: "Apply for structural changes, backend consolidation, file migrations, or architectural refactoring."
    - label: "performance"
      instructions: "Apply for game responsiveness, Convex optimization, real-time updates, or query performance."
    - label: "ui-components"
      instructions: "Apply for React component changes, Tailwind CSS styling, Next.js 15 patterns, or component behavior."
    - label: "testing"
      instructions: "Apply when adding/improving tests for game mechanics, mission validation, or component behavior."
    - label: "documentation"
      instructions: "Apply for README/docs changes, game guides, API documentation, or code comments. Ensure YAML front-matter."
    - label: "breaking"
      instructions: "Apply for breaking changes to game state, Convex schema, or component APIs. POV mode: no backwards compatibility needed."

  # Path-specific filters (exclude generated files and build artifacts)
  path_filters:
    - "!dist/**"
    - "!node_modules/**"
    - "!.next/**"
    - "!coverage/**"
    - "!convex/_generated/**"  # Convex runtime codegen only
    - "app/**"
    - "components/**"
    - "convex/**"
    - "packages/**"  # Include domain-spec package AND generated artifacts
    - "docs/**"
    - "*.md"
    - "*.json"
    - "*.yaml"
    - "*.yml"
    - "*.ts"
    - "*.tsx"
    - "*.pddl"  # Include PDDL domain/problem files

  # RogueNode path-specific review instructions
  path_instructions:
    - path: "convex/**"
      instructions: |
        Essential Convex review (POV mode):
        - Check authentication and authorization with Clerk (critical)
        - Verify no secrets are exposed (critical)
        - Ensure new function syntax with args/returns validators
        - Verify internal vs public function separation
        - Check proper use of convex/gameData.ts (not utils/GameData.ts)
        - Validate mission progress tracking and PDDL integration
        - No v.any() types - use proper Convex validators

    - path: "convex/gameData.ts"
      instructions: |
        Backend game data module review:
        - Verify imports from packages/domain-spec/runtime
        - Ensure single source of truth for game data
        - Check type safety with proper Room/Enemy/Mission types
        - No client-side imports (backend only)

    - path: "packages/domain-spec/**"
      instructions: |
        Domain specification review (PDDL integration):
        - Validate schema.ts changes for game entities
        - Check data.ts for mission definitions and optimal plans
        - Verify runtime.ts helper functions are type-safe
        - Review generated/ artifacts (committed to VCS, not runtime codegen)
        - Validate PDDL domain/problem file syntax
        - Check generated plan.json files for correctness
        - Ensure generated artifacts match source data.ts

    - path: "packages/domain-spec/generated/**"
      instructions: |
        Generated PDDL artifacts review:
        - Verify PDDL domain files are syntactically correct
        - Check problem files match mission definitions
        - Validate plan.json contains valid action sequences
        - Ensure generated files are committed (not gitignored)
        - Flag if generated artifacts are out of sync with data.ts
        - These are source files, not runtime codegen

    - path: "components/**"
      instructions: |
        Game component review (POV mode):
        - Focus on functionality and clean architecture
        - Game terminal command integration with missions
        - TypeScript safety (avoid any types)
        - Proper Convex query/mutation usage

    - path: "app/**"
      instructions: |
        Next.js App Router review (POV mode):
        - Convex integration with preloadQuery patterns
        - Clerk auth middleware and route protection
        - Clean architecture patterns
        - Proper TypeScript usage

    - path: "convex/auth.config.ts"
      instructions: |
        CRITICAL security focus (non-negotiable):
        - Clerk integration security
        - User identity validation
        - No exposed auth secrets
        - Proper session management

    - path: "convex/missions.ts"
      instructions: |
        Mission validation system review:
        - Verify PDDL plan validation logic
        - Check mission progress tracking
        - Ensure proper skill point awards
        - Validate feedback messages for players
        - Type safety with proper validators

    - path: "components/GameTerminal.tsx"
      instructions: |
        Game terminal essentials:
        - Command parsing security (prevent injection)
        - Mission feedback integration
        - Game state integrity
        - Terminal UI functionality

    - path: "**/*.test.*"
      instructions: |
        Testing review (POV mode):
        - Test coverage for mission validation
        - Security scenarios for auth and game state
        - PDDL integration test cases
        - Storage architecture tests

    - path: "docs/**"
      instructions: |
        Documentation review (POV mode):
        - Verify YAML front-matter (ssot-area, owner, derived-from)
        - Check accuracy for PDDL integration guides
        - Validate architecture diagrams and examples
        - Ensure migration guides are clear
        - No dead code references (e.g., utils/GameData.ts)

  abort_on_close: true
  disable_cache: false

  # Auto-review configuration
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: ["wip", "draft", "temp", "temporary"]
    labels: ["!wip", "!draft"]
    drafts: false
    base_branches: ["main", "develop", "preview"]
    ignore_usernames: []

  # Finishing touches
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

  # Pre-merge checks (enhanced from existing)
  pre_merge_checks:
    docstrings:
      mode: "warning"  # Relaxed for PoC/MVP development
      threshold: 50     # Lower threshold for faster game development iteration

    title:
      mode: "warning"
      requirements: "Start with an imperative verb; keep under 50 characters."

    description:
      mode: "warning"   # Allow empty descriptions during rapid PoC/MVP development

    issue_assessment:
      mode: "warning"

    # RogueNode custom checks for POV development (max 5 checks)
    custom_checks:
      - name: "Critical Security"
        mode: "error"
        instructions: "Verify no hardcoded secrets. Ensure Clerk auth and game state integrity."

      - name: "Convex Standards"
        mode: "error"
        instructions: |
          **Scope**: Convex backend files (convex/**/*.ts, convex/**/*.tsx)
          **Auto-pass**: Documentation, tests, config files, convex/_generated/**

          For Convex functions:
          - New syntax with args/returns validators
          - Auth checks on public functions
          - Internal vs public separation
          - No v.any() types

          For other files: Not applicable (auto-pass)

      - name: "PDDL Integration"
        mode: "warning"
        instructions: |
          **Scope**: Mission data files only
          - packages/domain-spec/data.ts
          - convex/domainSpec/data.ts
          - convex/missions.ts
          - packages/domain-spec/generated/**

          **Auto-pass**: Documentation unless it contains mission definition examples

          For mission files:
          - Validate missions have plans
          - Check generated artifacts match source

          For docs: Only verify mission examples reference valid missions

      - name: "Documentation"
        mode: "warning"
        instructions: |
          **Scope**: Documentation files (*.md, docs/**)

          ✅ PASS if:
          - YAML front-matter present (ssot-area, owner, derived-from)
          - No references to removed files in current examples
          - Migration guides clearly mark deprecated paths

          ⚠️ WARN if:
          - Missing front-matter
          - Dead code references without "deprecated" context
          - Unclear migration instructions

  # Essential tooling for RogueNode PoC/MVP development
  tools:
    # Critical security tools (non-negotiable)
    gitleaks:
      enabled: true

    semgrep:
      enabled: true

    # Code quality essentials for TypeScript/React
    eslint:
      enabled: true

    # Disabled for faster CI during PoC/MVP development
    # biome:
    #   enabled: false
    # markdownlint:
    #   enabled: false
    # yamllint:
    #   enabled: false
    # actionlint:
    #   enabled: false
    # hadolint:
    #   enabled: false
    # languagetool:
    #   enabled: false

    # GitHub integration
    github-checks:
      enabled: true
      timeout_ms: 90000  # Reduced timeout for faster game development feedback

# =============================================================================
# CHAT
# =============================================================================

chat:
  art: true
  auto_reply: true

  integrations:
    jira:
      usage: "auto"
    linear:
      usage: "auto"

# =============================================================================
# KNOWLEDGE BASE
# =============================================================================

knowledge_base:
  opt_out: false

  web_search:
    enabled: true

  code_guidelines:
    enabled: true
    filePatterns:
      - "**/CLAUDE.md"
      - "docs/**/*.md"
      - ".github/**/*.md"
      - "**/README.md"
      - "**/.cursorrules"
      - ".augment/rules/**/*.md"
      - "packages/domain-spec/README.md"

  learnings:
    scope: "local"

  issues:
    scope: "local"

  jira:
    usage: "disabled"
    project_keys: []

  linear:
    usage: "disabled"
    team_keys: []

  pull_requests:
    scope: "local"

  mcp:
    usage: "auto"
    disabled_servers: []

# =============================================================================
# CODE GENERATION
# =============================================================================

code_generation:
  docstrings:
    language: "en-US"
    path_instructions:
      - path: "convex/**"
        instructions: "Generate JSDoc comments for Convex functions including parameter types, return types, mission validation logic, and PDDL integration notes. Focus on auth requirements, internal vs public distinction, and game state considerations."

      - path: "packages/domain-spec/**"
        instructions: "Generate JSDoc comments for runtime utilities, mission helpers, and validation functions. Include PDDL plan structure details and mission lookup examples."

      - path: "components/**"
        instructions: "Generate TSDoc comments for React components including prop descriptions, mission feedback integration, and game mechanics usage. Focus on command parsing and mission display."

  unit_tests:
    path_instructions:
      - path: "convex/**"
        instructions: "Generate tests for Convex functions including mission validation, PDDL plan checking, auth conditions, and security cases. Focus on mission progress tracking and game state integrity."

      - path: "packages/domain-spec/**"
        instructions: "Generate tests for runtime utilities, mission helpers, and validation logic. Test PDDL plan parsing and mission lookup functions."

      - path: "components/**"
        instructions: "Generate React Testing Library tests focusing on game terminal interactions, mission feedback display, and component functionality. Test command parsing with mission validation."
